spring.application.name=carbonhub

# DB
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

#JPA
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}

# JWT
security.jwt.secret-key=${JWT_SECRET}
security.jwt.expiration-time=${JWT_EXPIRATION}
# Tope absoluto de la sesion (12 h). Cada peticion autenticada devuelve un token nuevo, asi que sin
# este tope basta con usar la aplicacion una vez por hora para no cerrar sesion nunca, y un token
# robado serviria para siempre. Pasado el tope se deja de renovar y hay que volver a autenticarse.
security.jwt.max-session-time=${JWT_MAX_SESSION:43200000}

# Google OpenID Connect
security.google.client-id=${GOOGLE_CLIENT_ID:}
security.google.jwks-uri=https://www.googleapis.com/oauth2/v3/certs
security.google.timeout-ms=${EXTERNAL_API_TIMEOUT:10000}

# Correo (SMTP - Gmail)
# app.email.provider=gmail habilita el envio real por Gmail SMTP.
# Por defecto (sin configurar nada) usa el stub que solo loguea el enlace.
app.email.provider=${APP_EMAIL_PROVIDER:stub}
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${GMAIL_USERNAME:}
spring.mail.password=${GMAIL_APP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

#Spring AI
spring.ai.google.genai.api-key=${GEMINI_API_KEY}
spring.ai.google.genai.chat.options.model=gemini-3.1-flash-lite
spring.ai.google.genai.chat.options.temperature=0.2
spring.ai.google.genai.chat.options.timeout=10s
ia.rate-limit.max-requests=${IA_RATE_LIMIT_MAX:10}
ia.rate-limit.window-ms=${IA_RATE_LIMIT_WINDOW_MS:3600000}

frontend.verificar-correo-url=${FRONTEND_VERIFICAR_CORREO_URL:http://localhost:4200/verificar-correo}
frontend.invitacion-url=${FRONTEND_INVITACION_URL:http://localhost:4200/registro/invitacion}
frontend.reset-contrasena-url=${FRONTEND_RESET_CONTRASENA_URL:http://localhost:4200/reset-contrasena}
frontend.login-url=${FRONTEND_LOGIN_URL:http://localhost:4200/login}
# El boton "Ver certificacion" de las alertas de vencimiento (PP-71). {slug} se sustituye por el
# de la empresa. El default apunta al perfil publico porque la vista privada de detalle de una
# certificacion todavia no existe en el frontend; cuando exista, es cambiar solo esta variable.
frontend.certificacion-detalle-url=${FRONTEND_CERTIFICACION_DETALLE_URL:http://localhost:4200/empresa/{slug}/reputacion/certificaciones}

# CORS
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200}

# Invitaciones
invitacion.reintento-intervalo-ms=${INVITACION_REINTENTO_INTERVALO_MS:300000}

# Validacion de auditores
validacion.reintento-intervalo-ms=${VALIDACION_REINTENTO_INTERVALO_MS:300000}

# Certificacion
certificacion.url-base=${CERTIFICACION_URL_BASE:}
certificacion.eventos-path=${CERTIFICACION_EVENTOS_PATH:/api/certificacion/eventos}
certificacion.tiempo-espera-ms=${EXTERNAL_API_TIMEOUT:10000}
certificacion.reintento-intervalo-ms=${CERTIFICACION_REINTENTO_INTERVALO_MS:300000}
certificacion.api-key-header=${CERTIFICACION_API_KEY_HEADER:X-Certificacion-Api-Key}
certificacion.api-key=${CERTIFICACION_API_KEY:}

# Verificacion de correo (reenvio)
verificacion.reintento-intervalo-ms=${VERIFICACION_REINTENTO_INTERVALO_MS:300000}

# Reset de contrasena
reset-contrasena.reintento-intervalo-ms=${RESET_CONTRASENA_REINTENTO_INTERVALO_MS:300000}

# Login - limite complementario por IP
auth.login.rate-limit.max-requests=${AUTH_LOGIN_RATE_LIMIT_MAX:20}
auth.login.rate-limit.window-ms=${AUTH_LOGIN_RATE_LIMIT_WINDOW_MS:60000}

# Registro - freno a la enumeracion de cuentas. El registro responde distinto si el correo ya
# existe (409) que si es nuevo (201), que es lo que el usuario necesita leer; el limite es lo que
# impide convertir esa diferencia en un listado completo de quien esta registrado.
auth.registro.rate-limit.max-requests=${AUTH_REGISTRO_RATE_LIMIT_MAX:10}
auth.registro.rate-limit.window-ms=${AUTH_REGISTRO_RATE_LIMIT_WINDOW_MS:60000}

# Reset de contrasena - limite por IP. El control real vive en RestablecerContrasenaService, que
# corta en 3 por hora POR CUENTA; este solo evita que se martille el endpoint desde una IP.
auth.reset.rate-limit.max-requests=${AUTH_RESET_RATE_LIMIT_MAX:10}
auth.reset.rate-limit.window-ms=${AUTH_RESET_RATE_LIMIT_WINDOW_MS:60000}

# Direccion de escucha e identificacion del cliente. Estas dos van juntas y no se tocan por
# separado.
#
# Se escucha solo en loopback: la app no tiene por que ser alcanzable desde la red local. Un
# despliegue en contenedor SI necesita 0.0.0.0, porque ahi el trafico entra por otra interfaz.
#
# forward-headers-strategy=NATIVE hace que getRemoteAddr() devuelva la IP real que el proxy
# anuncia en X-Forwarded-For, en vez de la del proxy. Sin esto, detras de un tunel (ngrok) todas
# las peticiones se ven como 127.0.0.1 y comparten cubeta de rate limit: veinte intentos de un
# atacante dejan sin login a todo el mundo.
#
# Confiar en esa cabecera solo es seguro porque se escucha en loopback: nadie puede conectarse
# directo para falsificarla, unicamente el agente del tunel, que corre en esta misma maquina.
# Si alguien cambia server.address a 0.0.0.0 tiene que revisar esto, porque Tomcat confia por
# defecto en el rango privado y un atacante en la misma red podria inventarse la IP de origen.
server.address=${SERVER_ADDRESS:127.0.0.1}
server.forward-headers-strategy=${SERVER_FORWARD_HEADERS_STRATEGY:NATIVE}

# Reintento de interpretación IA
ima.reintento-intervalo-ms=${IMA_REINTENTO_INTERVALO_MS:300000}

# Auditorias (asignacion de auditor)
auditoria.reintento-intervalo-ms=${AUDITORIA_REINTENTO_INTERVALO_MS:300000}
auditoria.expiracion-asignacion-horas=${AUDITORIA_EXPIRACION_ASIGNACION_HORAS:120}
auditoria.expiracion-intervalo-ms=${AUDITORIA_EXPIRACION_INTERVALO_MS:3600000}

# Adjuntos multipart (solicitudes de auditoria: hasta 10 archivos de 15 MB)
spring.servlet.multipart.max-file-size=15MB
spring.servlet.multipart.max-request-size=160MB
# Emision de certificaciones OpenBadges 3.0 (PP-58)
# Prefijo distinto de 'certificacion.*' (L52-57), que pertenece al cliente saliente
# hacia el modulo externo de Certificacion de EcoRuta y no tiene relacion con esto.
certificaciones.emision.url-base=${CERTIFICACIONES_URL_BASE:http://localhost:8080}
certificaciones.emision.emisor-nombre=${CERTIFICACIONES_EMISOR_NOMBRE:CarbonHub}
certificaciones.emision.clave-id=${CERTIFICACIONES_CLAVE_ID:carbonhub-emision-1}
certificaciones.emision.clave-privada-pem=${CERTIFICACIONES_CLAVE_PRIVADA_PEM:}

# Perfil publico - rate limiting
perfilpublico.rate-limit.max-requests=${PERFIL_PUBLICO_RATE_LIMIT_MAX:60}
perfilpublico.rate-limit.window-ms=${PERFIL_PUBLICO_RATE_LIMIT_WINDOW_MS:60000}

# Alertas de vencimiento de certificaciones (PP-70) - diario a las 2:00 AM
certificaciones.alertas.cron-vencimiento=${CERTIFICACIONES_ALERTAS_CRON:0 0 2 * * *}
certificaciones.alertas.reintento-intervalo-ms=${CERTIFICACIONES_ALERTAS_REINTENTO_INTERVALO_MS:300000}

# EcoRuta - Priorización Ambiental
ecoruta.priorizacion.factor-boost=${ECORUTA_FACTOR_BOOST:0.15}

# Climatiq
climatiq.url-base=https://api.climatiq.io
climatiq.clave-api=${CLIMATIQ_API_KEY:}
climatiq.tiempo-espera-ms=${EXTERNAL_API_TIMEOUT:10000}

# Perfil publico - comparticion (PP-69)
app.perfil-publico.base-url=${PERFIL_PUBLICO_BASE_URL:http://localhost:4200}
app.perfil-publico.og-imagen-fallback=${PERFIL_PUBLICO_OG_IMAGEN_FALLBACK:https://carbonhub.app/images/og-default.png}
